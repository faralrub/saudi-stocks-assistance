<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saudi Stock AI - Your Stock Market Assistant</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="pagesCss/saudiAi.css">
    <style>
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            padding: 10px 15px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            z-index: 1000;
        }
        
        .back-button:hover {
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }
        
        .back-icon {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <a href="/" class="back-button">
        <span class="back-icon">←</span>
        Back to Home
    </a>
    
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;
        
        const SaudiAI = () => {
            const [messages, setMessages] = useState([]);
            const [inputMessage, setInputMessage] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState('');
            const messagesEndRef = useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            useEffect(() => {
                scrollToBottom();
            }, [messages]);

            const handleSendMessage = async (e) => {
                e.preventDefault();
                if (!inputMessage.trim() || isLoading) return;

                const userMessage = {
                    id: Date.now(),
                    text: inputMessage,
                    sender: 'user',
                    timestamp: new Date().toLocaleTimeString()
                };

                setMessages(prev => [...prev, userMessage]);
                setInputMessage('');
                setIsLoading(true);
                setError('');

                try {
                    const conversationHistory = messages.map(msg => ({
                        role: msg.sender === 'user' ? 'user' : 'assistant',
                        content: msg.text
                    }));

                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            message: inputMessage,
                            conversationHistory
                        }),
                    });

                    const data = await response.json();

                    if (response.ok) {
                        const aiMessage = {
                            id: Date.now() + 1,
                            text: data.response,
                            sender: 'ai',
                            timestamp: new Date().toLocaleTimeString()
                        };
                        setMessages(prev => [...prev, aiMessage]);
                    } else {
                        throw new Error(data.error || 'Failed to get response');
                    }
                } catch (err) {
                    setError(err.message);
                    const errorMessage = {
                        id: Date.now() + 1,
                        text: 'Sorry, I encountered an error. Please try again.',
                        sender: 'ai',
                        timestamp: new Date().toLocaleTimeString(),
                        isError: true
                    };
                    setMessages(prev => [...prev, errorMessage]);
                } finally {
                    setIsLoading(false);
                }
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    handleSendMessage(e);
                }
            };

            return (
                <div className="saudi-ai-container">
                    <div className="chat-header">
                        <div className="header-content">
                            <div className="ai-avatar">
                                <span className="ai-icon">🤖</span>
                            </div>
                            <div className="header-text">
                                <h1>Saudi Stock AI</h1>
                                <p>Your intelligent assistant for Saudi Exchange stocks</p>
                            </div>
                        </div>
                    </div>

                    <div className="chat-messages">
                        {messages.length === 0 && (
                            <div className="welcome-message">
                                <div className="welcome-icon">🇸🇦</div>
                                <h2>Welcome to Saudi Stock AI</h2>
                                <p>I'm here to help you with Saudi Exchange stocks, market analysis, stock predictions, and financial insights. How can I assist you today?</p>
                            </div>
                        )}
                        
                        {messages.map((message) => (
                            <div
                                key={message.id}
                                className={`message ${message.sender === 'user' ? 'user-message' : 'ai-message'} ${message.isError ? 'error-message' : ''}`}
                            >
                                <div className="message-content">
                                    <div className="message-text">{message.text}</div>
                                    <div className="message-timestamp">{message.timestamp}</div>
                                </div>
                            </div>
                        ))}
                        
                        {isLoading && (
                            <div className="message ai-message">
                                <div className="message-content">
                                    <div className="typing-indicator">
                                        <span></span>
                                        <span></span>
                                        <span></span>
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        <div ref={messagesEndRef} />
                    </div>

                    {error && (
                        <div className="error-banner">
                            <span>⚠️ {error}</span>
                        </div>
                    )}

                    <form className="chat-input-form" onSubmit={handleSendMessage}>
                        <div className="input-container">
                            <textarea
                                value={inputMessage}
                                onChange={(e) => setInputMessage(e.target.value)}
                                onKeyPress={handleKeyPress}
                                placeholder="Ask me about Saudi Exchange stocks, analysis, or predictions..."
                                disabled={isLoading}
                                rows="1"
                                className="chat-input"
                            />
                            <button
                                type="submit"
                                disabled={!inputMessage.trim() || isLoading}
                                className="send-button"
                            >
                                {isLoading ? (
                                    <span className="loading-spinner"></span>
                                ) : (
                                    <span>➤</span>
                                )}
                            </button>
                        </div>
                    </form>
                </div>
            );
        };

        const App = () => {
            return <SaudiAI />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
